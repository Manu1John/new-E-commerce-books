# ==========================================
# E-Commerce NGINX Configuration Template
# ==========================================
# Instructions:
# 1. Place this file in /etc/nginx/sites-available/yourdomain.com
# 2. Symlink to sites-enabled: sudo ln -s /etc/nginx/sites-available/yourdomain.com /etc/nginx/sites-enabled/
# 3. Test config: sudo nginx -t
# 4. Reload NGINX: sudo systemctl reload nginx
# 5. Obtain SSL via Certbot: sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# ==========================================

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Optional: Increase body size if you handle large image uploads
    client_max_body_size 20M;

    location / {
        proxy_pass http://localhost:5000; # Must match your Node app PORT
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP Forwarding (Critical for Express Rate Limit)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Let NGINX serve static files directly for better performance
    # location /public/ {
    #     alias /path/to/your/project/public/;
    #     expires 1d;
    #     access_log off;
    # }

    # location /uploads/ {
    #     alias /path/to/your/project/uploads/;
    #     expires 30d;
    #     access_log off;
    # }
}
